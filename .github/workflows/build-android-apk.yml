name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # AGP 8.12 / Gradle 9.3 richiedono JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # compileSdk 36, buildTools 36.0.0, NDK 27.1.12297006, cmake 3.22.1
      # (RN libs.versions.toml / Expo SDK 57): idempotente se gia' presenti sull'immagine
      - name: Android SDK
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # postinstall applica il patch di expo-modules-jsi (scripts/patch-jsi.js)
      - name: Dipendenze
        run: npm ci

      # /android e' in .gitignore: il progetto viene rigenerato qui
      - name: Prebuild Android
        run: npx expo prebuild -p android --no-install

      # La release e' firmata con il debug.keystore del template (firma stabile
      # fra un run e l'altro): APK installabile via sideload, non per lo Store
      - name: Build APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Info APK
        run: ls -lh android/app/build/outputs/apk/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
